name: Build iOS XCFramework

on:
  push:
    branches: [ "ios/*" ]
    paths:
      - "wstunnel-ios/**"
      - "wstunnel/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-ios.yaml"
  workflow_dispatch:

env:
  RUST_VERSION: "1.93.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build:
    name: Build WstunnelKit.xcframework
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: ios-xcframework

      - name: Build device (aarch64-apple-ios)
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET="${{ env.IPHONEOS_DEPLOYMENT_TARGET }}"
          cargo build --release --target aarch64-apple-ios -p wstunnel-ios

      - name: Build simulator (aarch64-apple-ios-sim)
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET="${{ env.IPHONEOS_DEPLOYMENT_TARGET }}"
          cargo build --release --target aarch64-apple-ios-sim -p wstunnel-ios

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libwstunnel_ios.a \
            -headers wstunnel-ios/include/ \
            -library target/aarch64-apple-ios-sim/release/libwstunnel_ios.a \
            -headers wstunnel-ios/include/ \
            -output WstunnelKit.xcframework

          echo "=== XCFramework Info ==="
          ls -lhR WstunnelKit.xcframework/
          shasum -a 256 WstunnelKit.xcframework/ios-arm64/libwstunnel_ios.a > CHECKSUM.sha256
          shasum -a 256 WstunnelKit.xcframework/ios-arm64-simulator/libwstunnel_ios.a >> CHECKSUM.sha256
          cat CHECKSUM.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WstunnelKit-xcframework
          path: |
            WstunnelKit.xcframework/
            CHECKSUM.sha256
          retention-days: 90