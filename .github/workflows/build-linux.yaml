name: Build Linux Shared Library

on:
  push:
    branches: [ "linux/*" ]
    paths:
      - "wstunnel-bridge-linux/**"
      - "wstunnel_bridge/**"
      - "wstunnel/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-linux.yaml"
  workflow_dispatch:

env:
  RUST_VERSION: "1.93.0"

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Build wstunnel-bridge-linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: linux-amd64

      - name: Build shared library
        run: cargo build --release --target x86_64-unknown-linux-gnu -p wstunnel-bridge-linux

      - name: Prepare artifact
        run: |
          mkdir -p artifact/include artifact/wstunnel_bridge
          cp target/x86_64-unknown-linux-gnu/release/libwstunnel_bridge_linux.so artifact/
          cp wstunnel-bridge-linux/include/wstunnel_bridge_linux.h artifact/include/
          cp wstunnel_bridge/__init__.py wstunnel_bridge/_ffi.py wstunnel_bridge/client.py wstunnel_bridge/types.py artifact/wstunnel_bridge/
          cd artifact && sha256sum libwstunnel_bridge_linux.so > CHECKSUM.sha256
          echo "=== Build Info ==="
          ls -lh libwstunnel_bridge_linux.so
          cat CHECKSUM.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wstunnel-bridge-linux-x86_64
          path: artifact/
          retention-days: 90

  build-linux-arm64:
    name: Build wstunnel-bridge-linux (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: linux-arm64

      - name: Build shared library
        run: cargo build --release --target aarch64-unknown-linux-gnu -p wstunnel-bridge-linux

      - name: Prepare artifact
        run: |
          mkdir -p artifact/include artifact/wstunnel_bridge
          cp target/aarch64-unknown-linux-gnu/release/libwstunnel_bridge_linux.so artifact/
          cp wstunnel-bridge-linux/include/wstunnel_bridge_linux.h artifact/include/
          cp wstunnel_bridge/__init__.py wstunnel_bridge/_ffi.py wstunnel_bridge/client.py wstunnel_bridge/types.py artifact/wstunnel_bridge/
          cd artifact && sha256sum libwstunnel_bridge_linux.so > CHECKSUM.sha256
          echo "=== Build Info ==="
          ls -lh libwstunnel_bridge_linux.so
          cat CHECKSUM.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wstunnel-bridge-linux-aarch64
          path: artifact/
          retention-days: 90