name: Release Linux

# Tag-triggered release of the linux/amd64 + linux/arm64 binaries,
# shipped as `wstunnel_<version>_linux_<arch>.tar.gz` tarballs, which
# is the file name downstream consumers resolve.
# Triggered by `.github/scripts/release-linux.sh`, which reads the
# version from wstunnel/Cargo.toml and pushes a `linux-v<version>` tag.

on:
  push:
    tags: [ "linux-v*" ]

env:
  RUST_VERSION: 1.93.0
  BIN_NAME: "wstunnel"

jobs:
  build:
    name: Build linux/${{ matrix.platform.archive_arch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-musl
            archive_arch: amd64
          - target: aarch64-unknown-linux-musl
            archive_arch: arm64

    steps:
      - name: Install package for linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Checkout Git repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          # `gh release create` below uses an explicit GH_TOKEN, no
          # need to leave the runner's GITHUB_TOKEN inside .git/config.
          persist-credentials: false

      - name: Install rust toolchain for Linux
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: "${{ env.RUST_VERSION }}"
          override: true
          target: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Build linux/${{ matrix.platform.archive_arch }} binary
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        env:
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ contains(matrix.platform.target, 'aarch64') && '14' || '12' }}
        # cross-rs is used for non-x86_64 targets so jemalloc compiles
        # against the toolchain image rather than the host gcc.
        with:
          command: build
          use-cross: ${{ !contains(matrix.platform.target, 'x86_64') }}
          args: --release --locked --features=jemalloc --bin wstunnel --target ${{ matrix.platform.target }}

      - name: Store artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release/${{ env.BIN_NAME }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Package + GitHub release
    needs: [ build ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Resolve version from tag and verify it matches Cargo.toml
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#linux-v}"
          MANIFEST=$(awk -F\" '/^version *= */ {print $2; exit}' wstunnel/Cargo.toml)
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "ERROR: tag says '${VERSION}', wstunnel/Cargo.toml says '${MANIFEST}'" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Package archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          declare -A ARCH=(
            [x86_64-unknown-linux-musl]=amd64
            [aarch64-unknown-linux-musl]=arm64
          )
          for target in "${!ARCH[@]}"; do
            arch="${ARCH[$target]}"
            dir="artifacts/${BIN_NAME}-${target}"
            archive="${BIN_NAME}_${VERSION}_linux_${arch}.tar.gz"
            chmod +x "${dir}/${BIN_NAME}"
            tar -czf "release/${archive}" -C "${dir}" "${BIN_NAME}"
            echo "packaged: ${archive}"
          done
          (cd release && sha256sum ./*.tar.gz > checksums.txt)
          ls -lh release/
          cat release/checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "wstunnel linux ${VERSION}" \
              --notes "Linux amd64 + arm64 builds for downstream consumers."
          fi
